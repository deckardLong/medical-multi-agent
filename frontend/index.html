<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>AURELIA — Trợ lý sức khoẻ gia đình</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;600;700&family=Syne:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Đặt theme trước khi React nạp để không bị nháy màu sai (FOUC) ở lần tải đầu.
      // Mặc định Light; chỉ dùng Dark khi người dùng đã tự chọn (khoá "aurelia.theme" chỉ được ghi khi bấm đổi).
      try {
        document.documentElement.dataset.theme = localStorage.getItem("aurelia.theme") === "dark" ? "dark" : "light";
      } catch (e) { document.documentElement.dataset.theme = "light"; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
